<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FBFB"/>
      <stop offset="1" stop-color="#EEF4F1"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <style>
      .h{font:700 12px 'Inter','Segoe UI',Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;fill:#64748B}
      .l{font:600 15px 'Inter','Segoe UI',Arial,sans-serif;fill:#0F172A}
      .b{font:500 14px 'Inter','Segoe UI',Arial,sans-serif;fill:#64748B}
      .m{font:700 30px 'Inter','Segoe UI',Arial,sans-serif;fill:#0F172A}
      .md{font:700 30px 'Inter','Segoe UI',Arial,sans-serif;fill:#F8FAFC}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="48" fill="url(#bg)"/>
  <circle cx="1310" cy="180" r="170" fill="#CCFBF1" fill-opacity=".68"/>
  <circle cx="270" cy="820" r="160" fill="#FEF3C7" fill-opacity=".58"/>
  <rect x="220" y="120" width="1160" height="760" rx="42" fill="#FFFFFF"/>
  <rect x="220" y="120" width="1160" height="64" rx="42" fill="#F8FAFC"/>
  <circle cx="268" cy="152" r="7" fill="#FCA5A5"/><circle cx="294" cy="152" r="7" fill="#FCD34D"/><circle cx="320" cy="152" r="7" fill="#6EE7B7"/>
  <text x="1118" y="158" class="h">Module overview</text>

  <rect x="258" y="212" width="300" height="152" rx="28" fill="#0F172A"/>
  <text x="294" y="254" class="h" fill="#94A3B8">Core workflows</text><text x="294" y="296" class="md">11</text><text x="294" y="322" class="b" fill="#94A3B8">Connected modules in one operating model</text>

  <rect x="584" y="212" width="758" height="152" rx="28" fill="#FFFFFF"/>
  <text x="620" y="254" class="h">Platform story</text>
  <text x="620" y="296" class="l">Modules inherit the same structure, approvals, and reporting logic.</text>
  <text x="620" y="326" class="b">Attendance, leave, payroll support, analytics, and admin controls stay connected.</text>

  <rect x="258" y="392" width="1084" height="420" rx="30" fill="#FFFFFF"/>
  <text x="294" y="434" class="h">Module grid</text>
  <rect x="294" y="462" width="240" height="148" rx="24" fill="#ECFEFF"/><text x="324" y="498" class="l">Attendance</text><text x="324" y="528" class="b">Shift coverage, missing punches, manager reviews</text>
  <rect x="552" y="462" width="240" height="148" rx="24" fill="#F8FAFC"/><text x="582" y="498" class="l">Leave</text><text x="582" y="528" class="b">Policy balances, overlap checks, approvals</text>
  <rect x="810" y="462" width="240" height="148" rx="24" fill="#F8FAFC"/><text x="840" y="498" class="l">Approvals</text><text x="840" y="528" class="b">Shared ownership paths across actions</text>
  <rect x="1068" y="462" width="238" height="148" rx="24" fill="#0F172A"/><text x="1098" y="498" class="l" fill="#F8FAFC">Analytics</text><text x="1098" y="528" class="b" fill="#94A3B8">Leadership insight from live workflow data</text>

  <rect x="294" y="634" width="502" height="146" rx="24" fill="#F8FAFC"/>
  <text x="324" y="672" class="h">Workflow relationship</text>
  <path d="M342 730H750" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/><path d="M342 730H660" stroke="url(#teal)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="438" cy="730" r="14" fill="#14B8A6"/><circle cx="548" cy="730" r="14" fill="#14B8A6"/><circle cx="660" cy="730" r="14" fill="#0F766E"/>
  <text x="392" y="700" class="l">Attendance</text><text x="512" y="700" class="l">Leave</text><text x="630" y="700" class="l">Payroll</text>

  <rect x="820" y="634" width="486" height="146" rx="24" fill="#FFFFFF"/>
  <text x="850" y="672" class="h">Operational summary</text>
  <rect x="850" y="696" width="132" height="56" rx="18" fill="#F8FAFC"/><text x="878" y="728" class="m">6</text><text x="876" y="748" class="b">Approval touchpoints</text>
  <rect x="998" y="696" width="132" height="56" rx="18" fill="#F8FAFC"/><text x="1030" y="728" class="m">1</text><text x="1014" y="748" class="b">Shared data model</text>
  <rect x="1146" y="696" width="132" height="56" rx="18" fill="#ECFEFF"/><text x="1174" y="728" class="m">24h</text><text x="1168" y="748" class="b">Response window</text>
</svg>
